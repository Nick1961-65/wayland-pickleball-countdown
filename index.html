<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayland Pickleball Vacation Countdown</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(#65c7f7, #f7d794);
  color: white;
}

.container {
  padding: 25px;
  width: 90%;
  max-width: 600px;
}

h1 {
  font-size: 30px;
  margin-bottom: 5px;
}

h2 {
  font-size: 22px;
  margin-top: 5px;
}

.destination {
  font-size: 18px;
  margin: 20px 0;
}

#countdown {
  font-size: 28px;
  font-weight: bold;
  line-height: 1.6;
}

.footer {
  margin-top: 25px;
  font-size: 17px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🏓 WAYLAND PICKLEBALL GROUP 🏓</h1>

  <h2>🌴 ANNUAL VACATION COUNTDOWN 🌴</h2>

  <div class="destination">
    Plantation Palms<br>
    Fort Morgan, Alabama<br><br>
    November 14, 2026
  </div>

  <div id="countdown"></div>

  <div class="footer">
    Get your paddles ready! 🏓🌊☀️
  </div>

</div>

<script>

var vacation = new Date("November 14, 2026 00:00:00 GMT-0500").getTime();

var timer = setInterval(function() {

  var now = new Date().getTime();

  var distance = vacation - now;

  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
    days + " DAYS<br>" +
    hours + " HOURS : " +
    minutes + " MINUTES : " +
    seconds + " SECONDS";

  if (distance < 0) {
    clearInterval(timer);
    document.getElementById("countdown").innerHTML =
      "🏓 VACATION TIME! 🏓<br>🌴 LET'S GO! 🌴";
  }

}, 1000);

</script>

</body>
</html>
